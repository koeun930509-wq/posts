<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게시판</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <header class="board-header">
      <h1>게시판</h1>
      <span id="postCount" class="post-count">Total 0건</span>
    </header>

    <div id="errorMsg" class="error-msg" hidden></div>

    <div class="table-wrapper">
      <table class="post-table">
        <thead>
          <tr>
            <th class="col-id">번호</th>
            <th class="col-title">제목</th>
            <th class="col-writer">작성자</th>
            <th class="col-view">조회수</th>
            <th class="col-date">작성일</th>
          </tr>
        </thead>
        <tbody id="postList">
          <tr>
            <td colspan="5" class="loading-row">불러오는 중...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="write-row">
      <button id="listBtn" class="btn">목록</button>
      <button id="writeBtn" class="btn btn-primary">글쓰기</button>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <select id="searchType">
          <option value="all">전체</option>
          <option value="title">제목</option>
          <option value="content">내용</option>
        </select>
        <input type="text" id="searchInput" placeholder="검색어를 입력하세요">
        <button id="searchBtn" class="btn">검색</button>
      </div>
    </div>

    <div id="pagination" class="pagination"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="list.js"></script>
</body>

</html>
